<pre>
<script>
    for (let i = 5; i <= 5; i--) {
        for (space = 1; space >= i; space--) {
            document.write(" ");
        }
        for (let j = 1; j <= (2 * i - 1); j++) {
            document.write("*");

        }
        document.write("<br>");
    }

</script>
