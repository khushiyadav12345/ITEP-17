<!--writeaprogram to perform currency conversion using switch. -->
<script>
    let a=Number(prompt("enter amount in INR"));
    let c=Number(prompt("1-USD 2-EUR"));
    switch(c){
        case 1:document.write("USD = "+ a*0.012);
        break;
        case 2:document.write("EUR ="+a*0.011);
        break;
        default:document.write("wrong choice");

    }
</script>
