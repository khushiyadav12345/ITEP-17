<!-- Write a program for restaurant order system using switch. -->
 <script>
     let n = prompt("welcome to happiness restaurant ")*1;
    switch(n){
        case 1: document.write("<br> fry rice");
        break;
          case 2: document.write("<br>pulse");
        break;
          case 3: document.write("<br>chapati");
        break;
          case 4: document.write("<br>salad");
        break;
          case 5: document.write("<br>paneer vegetable");
        break;
          case 6: document.write("<br>pappar");
        break;
          case 7: document.write("<br>pickle");
        break;
        default:document.write("<br>invalid value");
    }
 </script>
