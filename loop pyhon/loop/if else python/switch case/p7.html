<!-- Write a program to display grade based on marks using switch. -->
<script>
    let marks=prompt("Enter your marks ");
    switch(true){
    case (marks >= 90 && marks <=100): document.write(" grade A");
    break;
    case (marks >= 80): document.write("grade B");
        break;
    case (marks >= 70):document.write("grade C");
        break;
    case (marks >=60):document.write("grade D");
        break;
    case (marks >=50): document.write("grade E");
        break;
    default:document.write("Fail");
    }
</script>
