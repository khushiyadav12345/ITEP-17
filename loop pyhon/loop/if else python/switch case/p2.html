<!-- Write a program to check whether a given character is a vowel or consonant using switch. -->
<script>
    let n = prompt("Enter a character");
    switch(n){
        case 'a': document.write("vowel");break;
        case 'e': document.write("vowel");break;
        case 'i': document.write("vowel");break;
        case 'o': document.write("vowel");break;
        case 'u': document.write("vowel");break;
        default:document.write("consonant");
    }
</script>
