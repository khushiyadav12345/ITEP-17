
<!-- Write a program to create a login system menu using switch. -->
  <script>
     let n = prompt("press 1 for username.\npress 2 for password .\n press 3 for create an account.\n press 4 for signIn.\n press 5 for signUP.\n press 6 for forget password.")*1;
    switch(n){
        case 1: document.write("<br>username");
        break;
          case 2: document.write("<br>password");
        break;
          case 3: document.write("<br>create an account");
        break;
          case 4: document.write("<br>signIn");
        break;
          case 5: document.write("<br>signUP");
        break;
          case 6: document.write("<br>forget password");
        break;
        default:document.write("<br>invalid value");
    }
 </script>
