<!-- 
Write a program for language selection menu using switch. -->
 <script>
     let n = prompt("press 1 for hindi.\npress 2 for english.\n press 3 for marathi.\n press 4 for urdu.\n press 5 for bengali.\n press 6 for spanish.\n press 7 for french")*1;
    switch(n){
        case 1: document.write("<br>hindi");
        break;
          case 2: document.write("<br>english");
        break;
          case 3: document.write("<br>marathi");
        break;
          case 4: document.write("<br>urdu");
        break;
          case 5: document.write("<br>bengali");
        break;
          case 6: document.write("<br>spanish");
        break;
          case 7: document.write("<br>french");
        break;
        default:document.write("<br>invalid value");
    }
 </script>
