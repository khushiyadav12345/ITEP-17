<!-- Write a program to print the number of days in a month using switch. -->
  <script>
    let n=prompt("Enter a number of days in a month")*1;
    switch(n){
        case 1:document.write("<br>january for 31 days");break;
          case 2:document.write("<br>february for 28 or 29 days");break;
            case 3:document.write("<br>march for 31 days");break;
              case 4:document.write("<br>april for 30 days");break;
                case 5:document.write("<br>may for 31 days");break;
                  case 6:document.write("<br>june for 30 days");break;
                    case 7:document.write("<br>july for 31 days");break;
                      case 8:document.write("<br>august for 31 days");break;
                        case 9:document.write("<br>september for 30 days");break;
                          case 10:document.write("<br>octomber for 31 days");break;
                            case 11:document.write("<br>november for 30 days");break;
                              case 12:document.write("<br>december for 31 days");break;
                              default:document.write("invalid value");
    }
 </script>
