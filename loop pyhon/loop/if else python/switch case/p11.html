<!-- Write a program for ATM menu options using switch. -->
 <script>
     let n = prompt("press 1 for saving account.\npress 2 for balance enquiry.\n press 3 for cash withdrawl.\n press 4 for pin change/generate pin.\n press 5 for cheque book request.\n press 6 for fast cash.\n press 7 for exit")*1;
    switch(n){
        case 1: document.write("<br>saving account");
        break;
          case 2: document.write("<br>balance enquiry");
        break;
          case 3: document.write("<br>cash withdrawl");
        break;
          case 4: document.write("<br>pin change/generate pin");
        break;
          case 5: document.write("<br>cheque book request");
        break;
          case 6: document.write("<br>fast cash");
        break;
          case 7: document.write("<br>exit");
        break;
        default:document.write("<br>invalid value");
    }
 </script>
