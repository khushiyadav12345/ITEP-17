<!-- <Write a program to display shipping cost based on delivery option using switch. -->
<script>
    let n=prompt("Enter your delivery type local/city/other/international");
    switch(n){
    case"local": document.write("shipping cost: rs.220");
        break;
    case"city":document.write("shipping cost: rs.100");
        break;
    case"other":document.write("shipping cost: rs.80");
        break;
    case"international": document.write("shipping cost: rs.50");
        break;
    default:document.write("shipping cost: rs.500");
    }
</script>
