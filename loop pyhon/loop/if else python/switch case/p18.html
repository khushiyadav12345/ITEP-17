<!-- Write a program to display student result (Pass/Fail/Distinction) using switch. -->
<script>
    let marks=prompt("enter a marks");
    switch(true){
        case(marks>=40 && marks <75):document.write("Result:Pass");break;
         case(marks<=40):document.write("Result:fail");break;
        default:document.write("Result:distinction");break;
    }
</script>
