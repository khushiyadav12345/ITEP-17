<!-- Write a program to display traffic signal actions using switch. -->
 <script>
      let n = prompt("Enter a traffic signal");
    switch(n){
        case "red": document.write("<br>stop");
        break;
          case "green": document.write("<br>go");
          break;
          case "yellow": document.write("<br>get ready");
          break;
          document.write("<br>invalid value");
    }
 </script>
