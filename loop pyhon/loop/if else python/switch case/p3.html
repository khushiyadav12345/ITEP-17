<!-- Write a program to print the month name for a given month number (1–12). -->
 <script>
    let n=prompt("Enter a value")*1;
    switch(n){
        case 1:document.write("<br>January");break;
          case 2:document.write("<br>February");break;
            case 3:document.write("<br>March");break;
              case 4:document.write("<br>April");break;
                case 5:document.write("<br>May");break;
                  case 6:document.write("<br>June");break;
                    case 7:document.write("<br>July");break;
                      case 8:document.write("<br>August");break;
                        case 9:document.write("<br>September");break;
                          case 10:document.write("<br>Octomber");break;
                            case 11:document.write("<br>November");break;
                              case 12:document.write("<br>December");break;
                              default:document.write("invalid value");
    }

 </script>
