<!-- Write a program to implement role-based access using switch. -->
<script>
    let role= prompt("enter your role like doctor/teacher/student");
    switch(role){
        case"doctor":document.write("to check patient");break;
              case"teacher":document.write("to teach");break;
                    case"student":document.write("do study");break;
                          default:document.write("no access");break;
    }
</script>
