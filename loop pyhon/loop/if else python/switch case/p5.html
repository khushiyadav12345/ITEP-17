<!-- Write a program to print weekend or weekday using switch. -->
<script>
    let n = prompt("Enter a weekend or weekday")*1;
    switch(n){
        case 1: 
        case 2: 
        case 3:
        case 4:
        case 5: document.write("<br>weekday");
        break;
        case 6: 
        case 7:document.write("<br>weekend");
        break;
        default:document.write("invalid value");
    }
</script>
