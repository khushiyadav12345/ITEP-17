<!-- Write a program to calculate electricity bill slab-wise using switch. -->
<script>
    let num =prompt("enter electricity units:");
    switch(true){
        case num<=10:document.write("slab 1(0-10)");
        break;
        case num<=20:document.write("slab 2(11-20)");
        break;
        default:document.write("slab 3(21 and above)");
    }
</script>
