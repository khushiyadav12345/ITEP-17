<!-- Write a program to implement a menu-driven program using switch. -->
 <script>
     let n = prompt("press 1 for fry rice.\npress 2 for pulse.\n press 3 for chapti.\n press 4 for salad.\n press 5 for paneer vegetable.\n press 6 for pappar.\n press 7 for pickle")*1;
    switch(n){
        case 1: document.write("<br> fry rice");
        break;
          case 2: document.write("<br>pulse");
        break;
          case 3: document.write("<br>chapati");
        break;
          case 4: document.write("<br>salad");
        break;
          case 5: document.write("<br>paneer vegetable");
        break;
          case 6: document.write("<br>pappar");
        break;
          case 7: document.write("<br>pickle");
        break;
        default:document.write("<br>invalid value");
    }
 </script>
