<!-- 
Write a program to display movie ticket pricing based on age group using switch.
 -->
<script>
    let age=prompt("Enter your age ");
    switch(true){
    case (age >= 80): document.write("rs.220");
        break;
    case (age >= 60):document.write("rs.100");
        break;
    case (age >=40):document.write("rs.80");
        break;
    case (age >=18): document.write("rs.50");
        break;
    default:document.write("Free");
    }
</script>
