<!-- Write a program to print season name based on month using switch. -->

 <script>
    let n=prompt("Enter a season name like winter season/summer season/rainy season/autumn season");
    switch(n){
        case"winter season":document.write("<br>January,February,December");break;
            case "summer season":document.write("<br>March,April,May");break;
              case "rainy season":document.write("<br>June,July,August");break;
                case "autumn season":document.write("<br>September,Octomber,November");break;
                              default:document.write("invalid month");
    }
 </script>
