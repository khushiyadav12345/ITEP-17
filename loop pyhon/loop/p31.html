<!-- 31) 9	99	999	9999	  99999 ……. -->
<script>
    let i = 1;
    while (i <= 5) {
        let j = 1;
        while (j <= i) {
            document.write("9");
            j++;
        }
        if (i === 4) {
            document.write("&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;");
        } else {
            document.write("&nbsp;&nbsp;");
        }
        i++;
    }
   
</script>
